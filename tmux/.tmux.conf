# ==========================================
# CORE KEYBINDINGS & NAVIGATION
# ==========================================

# Set Ctrl-A as the prefix key (instead of Ctrl-B)
set -g prefix C-a 
unbind C-b
bind C-a send-prefix

# Vim-like pane navigation keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resize
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Intuitive pane splits
bind | split-window -h
bind - split-window -v

# Explicit window kill confirmation prompt
bind X confirm-before -p "Kill window #W? (y/n)" kill-window


# ==========================================
# GENERAL SETTINGS
# ==========================================

set -g status-position top        # Move the status bar to the top
set -g mouse on                   # Enable mouse control (resizing, clicking)
set -g default-terminal "tmux-256color"

set -g allow-passthrough on

# Extended keyboard support
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"

# Shift+Enter -> CSI-u sequence
bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75

# ==========================================
# CATPPUCCIN THEME CONFIGURATION
# ==========================================
# Note: Variables must be declared BEFORE sourcing the plugin in v2.x

# Global Theme Style
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_status_background "none"

# Window List Look & Feel
set -g window-status-separator ""
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_default_fill "number"

# Force window name (#W) instead of pane title (hostname)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Status Bar Left & Right Layout
set -g status-left ""
set -g status-right-length 100

set -g @catppuccin_date_time_text "%d %b %I:%M %p"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"


# ==========================================
# PLUGIN MANAGEMENT (TPM)
# ==========================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Auto-install TPM and plugins if running on a fresh machine
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (Always keep this line at the very bottom!)
run '~/.tmux/plugins/tpm/tpm'
