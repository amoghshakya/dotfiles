# ----------------------------------------------------------------------------
# /etc/tlp.conf - TLP configuration optimized for
#   Dell Inspiron 15-3567 | i5-7200U | Intel HD 620 + AMD Radeon R5
#   Profile: MAX PERFORMANCE on AC, BALANCED PERFORMANCE on BAT
# ----------------------------------------------------------------------------

TLP_ENABLE=1
TLP_WARN_LEVEL=1
TLP_MSG_COLORS="91 93 1 92"
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL

# --- CPU: intel_pstate active mode, HWP enabled ---------------------------

CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_DRIVER_OPMODE_ON_SAV=active

CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=balance_power

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_SAV=0

# --- Intel iGPU (i915 driver) --------------------------------------------

INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MAX_FREQ_ON_AC=1000
INTEL_GPU_MAX_FREQ_ON_BAT=700
INTEL_GPU_MAX_FREQ_ON_SAV=500
INTEL_GPU_BOOST_FREQ_ON_AC=1000
INTEL_GPU_BOOST_FREQ_ON_BAT=700
INTEL_GPU_BOOST_FREQ_ON_SAV=500

# --- AMD dGPU (amdgpu driver, Radeon R5 M330) ---------------------------

RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=low

# --- SATA SSD I/O --------------------------------------------------------

DISK_APM_LEVEL_ON_AC="255"
DISK_APM_LEVEL_ON_BAT="254"

SATA_LINKPWR_ON_AC="max_performance"
SATA_LINKPWR_ON_BAT="max_performance"

AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=on

# --- PCIe / ASPM ---------------------------------------------------------

PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersave
PCIE_ASPM_ON_SAV=powersupersave

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ON_SAV=auto

RUNTIME_PM_DRIVER_DENYLIST="amdgpu mei_me nouveau nvidia xhci_hcd"

# --- USB -----------------------------------------------------------------

USB_AUTOSUSPEND=0

# --- Audio ---------------------------------------------------------------

SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- Network / Radio -----------------------------------------------------

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
WOL_DISABLE=Y
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth nfc wwan"
DEVICES_TO_ENABLE_ON_STARTUP="wifi"

# --- Battery Care --------------------------------------------------------

START_CHARGE_THRESH_BAT0=70
STOP_CHARGE_THRESH_BAT0=80

# --- NMI Watchdog --------------------------------------------------------

NMI_WATCHDOG=0
